variables:
  RESET_DB:
    value: "false"
    description: "Set to 'true' to DROP and recreate the Odoo database before upgrading. ⚠️ DESTRUCTIVE."
  ALLOW_SAME_IMAGE:
    value: "false"
    description: "Set to 'true' to allow a rollout that re-pulls the same image digest (e.g. a RESET_DB-only restart). Otherwise a no-op deploy fails the job."

deploy-job:
  stage: deploy
  tags:
    - odoomoduleupdate
  script:
    - export KUBECONFIG=/home/gitlab-runner/kubeconfig.yaml
    - kubectl apply -f tvboRunnerActions.yaml
    - |
        # Always re-set, so toggling RESET_DB between runs takes effect deterministically.
        kubectl set env deployment/tvbo-odoo -n kube-system "RESET_DB=${RESET_DB:-false}"
    - |
        # Digest the live pod runs *before* the restart; re-pulling it means nothing shipped.
        IMG_BEFORE=$(kubectl get pods -n kube-system -l app=tvbo-odoo \
          -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.status.containerStatuses[0].imageID}{"\n"}{end}' \
          | head -1)
        echo "image before rollout: ${IMG_BEFORE:-<none>}"
    - kubectl rollout restart deployment/tvbo-odoo -n kube-system
    - |
        set +e
        echo "Waiting for rollout to complete..."
        kubectl rollout status deployment/tvbo-odoo -n kube-system --timeout=300s
        ROLLOUT_RC=$?
        echo "Rollout exit code: $ROLLOUT_RC"

        echo ""
        echo "===== Pod status ====="
        kubectl get pods -n kube-system -l app=tvbo-odoo -o wide

        # Pick the pod from the deployment's CURRENT ReplicaSet (not whichever was created last)
        RS=$(kubectl get rs -n kube-system -l app=tvbo-odoo \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[-1:].metadata.name}')
        # Find a pod owned by current RS, preferring Running
        POD=$(kubectl get pods -n kube-system -l app=tvbo-odoo \
          -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].name=='$RS')]}{.metadata.name} {.status.phase}{'\n'}{end}" \
          | awk '$2=="Running"{print $1; exit}')
        if [ -z "$POD" ]; then
          POD=$(kubectl get pods -n kube-system -l app=tvbo-odoo \
            -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].name=='$RS')]}{.metadata.name}{'\n'}{end}" \
            | head -1)
        fi
        echo ""
        echo "Most recent pod (from current RS $RS): $POD"
        if [ -z "$POD" ]; then
          echo "No pod found, exiting"
          exit $ROLLOUT_RC
        fi
        IMG_AFTER=$(kubectl get pod "$POD" -n kube-system -o jsonpath='{.status.containerStatuses[0].imageID}')
        echo "Image: $IMG_AFTER"

        echo ""
        echo "===== Waiting 60s for upgrade phase to finish/crash ====="
        for i in $(seq 1 12); do
          echo ""
          echo "--- [$((i*5))s] kubectl get pods ---"
          kubectl get pods -n kube-system -l app=tvbo-odoo -o wide
          STATE=$(kubectl get pod "$POD" -n kube-system -o jsonpath='{.status.containerStatuses[0].state}' 2>/dev/null)
          RESTARTS=$(kubectl get pod "$POD" -n kube-system -o jsonpath='{.status.containerStatuses[0].restartCount}' 2>/dev/null)
          echo "state=$STATE restarts=$RESTARTS"
          # Stop early if pod crashed
          if echo "$STATE" | grep -q terminated; then
            echo "Pod terminated — stopping wait"
            break
          fi
          sleep 5
        done

        echo ""
        echo "===== Final pod status ====="
        kubectl get pods -n kube-system -l app=tvbo-odoo -o wide

        echo ""
        echo "===== Pod describe (events at bottom) ====="
        kubectl describe pod "$POD" -n kube-system | tail -50

        echo ""
        echo "===== Pod logs (current container, last 1000 lines) ====="
        kubectl logs "$POD" -n kube-system --tail=1000 || true

        echo ""
        echo "===== Pod logs (previous container, if crashed) ====="
        kubectl logs "$POD" -n kube-system --previous --tail=1000 2>/dev/null || echo "(no previous container)"

        echo ""
        echo "===== Persistent upgrade log (/var/lib/odoo/upgrade.log[.prev]) ====="
        kubectl exec -n kube-system "$POD" -- sh -c 'echo "--- previous run (upgrade.log.prev) ---"; tail -200 /var/lib/odoo/upgrade.log.prev 2>/dev/null || echo "(no .prev)"; echo; echo "--- current run (upgrade.log) ---"; tail -200 /var/lib/odoo/upgrade.log 2>/dev/null || echo "(no current)"' || echo "(could not exec into pod)"

        echo ""
        echo "===== Health check ====="
        kubectl exec -n kube-system "$POD" -- curl -sS -o /dev/null -w "internal HTTP %{http_code}\n" http://localhost:8069/tvbo/api/kg/schema || true

        echo ""
        echo "===== KG completeness gate (/tvbo/api/kg/health) ====="
        # KG_OK = every ground-truth category fully ingested; anything else means records are missing.
        KG_HEALTH=$(kubectl exec -n kube-system "$POD" -- curl -sS http://localhost:8069/tvbo/api/kg/health 2>/dev/null)
        echo "$KG_HEALTH"
        KG_VERDICT=$(printf '%s' "$KG_HEALTH" | sed -nE 's/.*"verdict"[[:space:]]*:[[:space:]]*"([A-Z_]+)".*/\1/p')
        KG_RC=0
        if [ "$KG_VERDICT" = "KG_OK" ]; then
          echo "✓ KG GATE PASSED: verdict=KG_OK"
        else
          echo "✗ KG GATE FAILED: verdict='${KG_VERDICT:-unparseable}' (expected KG_OK)."
          echo "  Deploy marked FAILED: the Knowledge Graph is incomplete. See 'shortfalls'/'hint'"
          echo "  above and the pod's 'TVBO KG SUMMARY' banner for the missing categories."
          KG_RC=1
        fi

        echo ""
        echo "===== Image digest gate ====="
        # A restart onto the identical digest ships nothing; that is how a stale image once survived seven weeks.
        IMG_RC=0
        if [ -z "$IMG_AFTER" ]; then
          echo "✗ IMAGE GATE FAILED: could not read the running pod's imageID."
          IMG_RC=1
        elif [ -z "$IMG_BEFORE" ]; then
          echo "✓ IMAGE GATE PASSED: no previous running pod to compare against."
        elif [ "$IMG_BEFORE" = "$IMG_AFTER" ]; then
          if [ "${ALLOW_SAME_IMAGE:-false}" = "true" ]; then
            echo "✓ IMAGE GATE SKIPPED: digest unchanged, allowed by ALLOW_SAME_IMAGE=true."
          else
            echo "✗ IMAGE GATE FAILED: the pod restarted onto the SAME digest, so this deploy shipped nothing."
            echo "  digest: $IMG_AFTER"
            echo "  The :main tag has not moved. Check that the GitHub Actions build for this commit"
            echo "  finished and pushed ghcr.io/leon-k-martin/tvbo-platform:main BEFORE running this job."
            echo "  For an intentional restart (RESET_DB only), re-run with ALLOW_SAME_IMAGE=true."
            IMG_RC=1
          fi
        else
          echo "✓ IMAGE GATE PASSED: digest moved"
          echo "  from ${IMG_BEFORE}"
          echo "  to   ${IMG_AFTER}"
        fi

        # Fail on a bad rollout, an unchanged image, OR an incomplete KG.
        [ "$ROLLOUT_RC" -ne 0 ] && exit "$ROLLOUT_RC"
        [ "$IMG_RC" -ne 0 ] && exit "$IMG_RC"
        exit "$KG_RC"
  when: manual

