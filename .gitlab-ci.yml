deploy-job:
  stage: deploy
  tags:
    - odoomoduleupdate
  script:
    - export KUBECONFIG=/home/gitlab-runner/kubeconfig.yaml
    - kubectl apply -f tvboRunnerActions.yaml
    - kubectl rollout restart deployment/tvbo-odoo -n kube-system
    - |
        set +e
        echo "Waiting for rollout to complete..."
        kubectl rollout status deployment/tvbo-odoo -n kube-system --timeout=300s
        ROLLOUT_RC=$?
        echo "Rollout exit code: $ROLLOUT_RC"

        echo ""
        echo "===== Pod status ====="
        kubectl get pods -n kube-system -l app=tvbo-odoo -o wide

        # Pick the pod from the deployment's CURRENT ReplicaSet (not whichever was created last)
        RS=$(kubectl get rs -n kube-system -l app=tvbo-odoo \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[-1:].metadata.name}')
        # Find a pod owned by current RS, preferring Running
        POD=$(kubectl get pods -n kube-system -l app=tvbo-odoo \
          -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].name=='$RS')]}{.metadata.name} {.status.phase}{'\n'}{end}" \
          | awk '$2=="Running"{print $1; exit}')
        if [ -z "$POD" ]; then
          POD=$(kubectl get pods -n kube-system -l app=tvbo-odoo \
            -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].name=='$RS')]}{.metadata.name}{'\n'}{end}" \
            | head -1)
        fi
        echo ""
        echo "Most recent pod (from current RS $RS): $POD"
        if [ -z "$POD" ]; then
          echo "No pod found, exiting"
          exit $ROLLOUT_RC
        fi
        echo "Image: $(kubectl get pod "$POD" -n kube-system -o jsonpath='{.status.containerStatuses[0].imageID}')"

        echo ""
        echo "===== Waiting 60s for upgrade phase to finish/crash ====="
        for i in $(seq 1 12); do
          STATE=$(kubectl get pod "$POD" -n kube-system -o jsonpath='{.status.containerStatuses[0].state}' 2>/dev/null)
          RESTARTS=$(kubectl get pod "$POD" -n kube-system -o jsonpath='{.status.containerStatuses[0].restartCount}' 2>/dev/null)
          echo "[$((i*5))s] state=$STATE restarts=$RESTARTS"
          # Stop early if pod crashed
          if echo "$STATE" | grep -q terminated; then
            echo "Pod terminated — stopping wait"
            break
          fi
          sleep 5
        done

        echo ""
        echo "===== Pod describe (events at bottom) ====="
        kubectl describe pod "$POD" -n kube-system | tail -50

        echo ""
        echo "===== Pod logs (current container, last 1000 lines) ====="
        kubectl logs "$POD" -n kube-system --tail=1000 || true

        echo ""
        echo "===== Pod logs (previous container, if crashed) ====="
        kubectl logs "$POD" -n kube-system --previous --tail=1000 2>/dev/null || echo "(no previous container)"

        echo ""
        echo "===== Persistent upgrade log (/var/lib/odoo/upgrade.log[.prev]) ====="
        kubectl exec -n kube-system "$POD" -- sh -c 'echo "--- previous run (upgrade.log.prev) ---"; tail -200 /var/lib/odoo/upgrade.log.prev 2>/dev/null || echo "(no .prev)"; echo; echo "--- current run (upgrade.log) ---"; tail -200 /var/lib/odoo/upgrade.log 2>/dev/null || echo "(no current)"' || echo "(could not exec into pod)"

        echo ""
        echo "===== Health check ====="
        kubectl exec -n kube-system "$POD" -- curl -sS -o /dev/null -w "internal HTTP %{http_code}\n" http://localhost:8069/tvbo/api/kg/schema || true

        exit $ROLLOUT_RC
  when: manual

