[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tvbo-platform-client"
version = "0.1.0"
description = "Python client for the TVBO platform REST API (load/push your saved models and experiments)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
# Needed only for the load_*/object helpers and pydantic-object pushes.
tvbo = ["tvbo"]
yaml = ["PyYAML>=5.4"]

[tool.setuptools]
packages = ["tvbo_platform"]
