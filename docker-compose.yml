# Docker Compose for LOCAL DEVELOPMENT
# Code mounted as volumes for immediate updates (no rebuild needed)

services:
  postgres:
    image: postgres:17
    container_name: tvbo-postgres-dev
    environment:
      POSTGRES_DB: tvbo_dev
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - tvbo-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Avoid conflict with other postgres instances
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d tvbo_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  tvbo-api:
    build:
      context: /Users/leonmartin_bih/tools/tvbo/docker
      dockerfile: Dockerfile.dev
    container_name: tvbo-api-dev
    image: tvbo:dev-local
    environment:
      MODE: api
      PYTHONPATH: /app/tvbo-src
    volumes:
      # Mount local tvbo source (writable for editable install)
      - /Users/leonmartin_bih/tools/tvbo:/app/tvbo-src
    ports:
      - "8001:8000"  # Avoid conflict with other APIs
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command: ["pip install -e '/app/tvbo-src[api,julia]' && exec /entrypoint.sh"]

  odoo:
    build:
      context: .
      dockerfile: Dockerfile.odoo.dev
      args:
        CACHE_BUST: ${CACHE_BUST:-1}
    container_name: tvbo-odoo-dev
    image: tvbo-platform:dev
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: odoo
      DB_NAME: tvbo_dev
      # Pass RESET_DB=1 on the CLI to drop+recreate+reseed on startup; defaults off.
      RESET_DB: ${RESET_DB:-0}
      # Schema reconciler path (the prod image bakes it in at /opt/tvbo; in dev we
      # mount it below) so init-odoo.sh and the migration hooks can bridge schema
      # shape changes on `-u tvbo` exactly as production does.
      TVBO_RECONCILE_PY: /opt/tvbo/reconcile_schema.py
    volumes:
      # Mount code for immediate updates (no rebuild!)
      - ./odoo-addons/tvbo:/mnt/extra-addons/tvbo:ro
      - /Users/leonmartin_bih/tools/tvbo:/tmp/tvbo:ro
      - ./init-odoo.sh:/init-odoo.sh:ro
      - ./scripts/reconcile_schema.py:/opt/tvbo/reconcile_schema.py:ro
      - tvbo-odoo-data:/var/lib/odoo
    ports:
      - "8169:8069"  # TVBO platform port
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--dev=reload,qweb,werkzeug,xml"]

  mineru:
    build:
      context: .
      dockerfile: Dockerfile.mineru
    container_name: tvbo-mineru-dev
    volumes:
      - mineru-models:/root/.cache
      - mineru-output:/app/output
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  tvbo-postgres-data:
  tvbo-odoo-data:
  mineru-models:
  mineru-output:
