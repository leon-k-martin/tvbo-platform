apiVersion: v1
kind: Secret
metadata:
  name: tvbo-postgres-db-credentials
  namespace: kube-system
stringData:
  POSTGRES_DB: tvbo_postgres
  POSTGRES_USER: tvbo_odoo
  POSTGRES_PASSWORD: odoo  # Change in production!

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tvbo-postgres-pvc
  namespace: kube-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: microk8s-hostpath
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: kube-system
  name: tvbo-odoo-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: microk8s-hostpath
---
apiVersion: v1
kind: Service
metadata:
  name: tvbo-postgres
  namespace: kube-system
spec:
  selector:
    app: tvbo-postgres
  ports: [{port: 5432}]

---
apiVersion: v1
kind: Service
metadata:
  name: tvbo-api
  namespace: kube-system
spec:
  selector:
    app: tvbo-api
  ports: [{port: 8000}]



---
apiVersion: v1
kind: Service
metadata:
  name: odoo
  namespace: kube-system
spec:
  selector:
    app: tvbo-odoo
  ports: [{port: 8069}]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tvbo-odoo
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: tvbo-odoo
  template:
    metadata:
      labels:
        app: tvbo-odoo
    spec:
      imagePullSecrets:
        - name: github-credentials
      containers:
        - name: tvbo-odoo
          image: ghcr.io/leon-k-martin/tvbo-platform:main
          imagePullPolicy: Always
          ports: [{containerPort: 8069}]
          env:
            - {name: HOST, value: tvbo-postgres}
            - {name: USER, value: tvbo_odoo}
            - {name: PASSWORD, value: odoo}
            - {name: TVBO_API_URL, value: http://tvbo-api:8000}
          volumeMounts: [{name: data, mountPath: /var/lib/odoo}]
          readinessProbe:
            httpGet: {path: /web/health, port: 8069}
            initialDelaySeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tvbo-odoo-pvc
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tvbo-api
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: tvbo-api
  template:
    metadata:
      labels:
        app: tvbo-api
    spec:
      containers:
        - name: tvbo-api
          image: leonmartin2/tvbo:dev
          imagePullPolicy: Always
          ports: [{containerPort: 8000}]
          env: [{name: MODE, value: api}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 120
            periodSeconds: 20

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tvbo-postgres
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: tvbo-postgres
  template:
    metadata:
      labels:
        app: tvbo-postgres
    spec:
      containers:
        - name: tvbo-postgres
          image: postgres:17
          ports: [{containerPort: 5432}]
          envFrom: [{secretRef: {name: tvbo-postgres-db-credentials}}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tvbo-postgres-pvc

---
# MinerU document parser (CPU-only, pipeline backend)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mineru-models-pvc
  namespace: kube-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: microk8s-hostpath
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mineru-output-pvc
  namespace: kube-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: microk8s-hostpath
---
apiVersion: v1
kind: Service
metadata:
  name: mineru
  namespace: kube-system
spec:
  selector:
    app: mineru
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mineru
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: mineru
  template:
    metadata:
      labels:
        app: mineru
    spec:
      containers:
        - name: mineru
          image: ghcr.io/leon-k-martin/tvbo-mineru:latest
          ports: [{containerPort: 8000}]
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - {name: models, mountPath: /root/.cache}
            - {name: output, mountPath: /app/output}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 90
            periodSeconds: 20
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: mineru-models-pvc
        - name: output
          persistentVolumeClaim:
            claimName: mineru-output-pvc

---
# Ingress — Kong API Gateway routes
# /api/*  → tvbo-api FastAPI server (network data, ontology, simulation)
# /ocr/*  → MinerU document parser (PDF → Markdown)
# /*      → Odoo (website, knowledge graph browser, configurator)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tvbo
  namespace: kube-system
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - host: tvbo.charite.de
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tvbo-api
                port:
                  number: 8000
          - path: /ocr
            pathType: Prefix
            backend:
              service:
                name: mineru
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8069
