tvbo_class: tvbo:Network
schema_version: tvb-datamodel/0.7.0
label: Desikan-Killiany
description: Structural connectivity from dk_average dataset
number_of_nodes: 84
distance_unit: mm
time_unit: ms
data_file: connectome.h5
coupling:
  DelayedSigmoidalJansenRit:
    name: DelayedSigmoidalJansenRit
    label: Delayed Sigmoidal Jansen-Rit Coupling
    parameters:
      G:
        name: G
        value: 15.0
        reported_optimum: 0.0
        description: Global coupling strength
        free: true
      cmax:
        name: cmax
        value: 0.005
        reported_optimum: 0.0
        description: 2 * nu_max from TVB default
      cmin:
        name: cmin
        reported_optimum: 0.0
      midpoint:
        name: midpoint
        value: 6.0
        reported_optimum: 0.0
      r:
        name: r
        value: 0.56
        reported_optimum: 0.0
    description: Sigmoidal Jansen-Rit coupling function with delays
    sparse: false
    pre_expression:
      rhs: cmin + (cmax - cmin) / (1.0 + exp(r * (midpoint - (y1 - y2))))
      latex: false
    post_expression:
      rhs: G * gx
      latex: false
    incoming_states:
    - y1
    - y2
    delayed: true
    symmetry: directed
parameters:
  conduction_speed:
    value: 3.0
    reported_optimum: 0.0
    unit: mm_per_ms
