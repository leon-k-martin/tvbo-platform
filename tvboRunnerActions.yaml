---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tvbo-api
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: tvbo-api
  template:
    metadata:
      labels:
        app: tvbo-api
    spec:
      containers:
        - name: tvbo-api
          image: leonmartin2/tvbo:dev
          imagePullPolicy: Always
          ports: [{containerPort: 8000}]
          env:
            - {name: MODE, value: api}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tvbo-odoo
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: tvbo-odoo
  template:
    metadata:
      labels:
        app: tvbo-odoo
    spec:
      imagePullSecrets:
        - name: github-credentials
      containers:
        - name: tvbo-odoo
          image: ghcr.io/leon-k-martin/tvbo-platform:main
          imagePullPolicy: Always
          ports: [{containerPort: 8069}]
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          env:
            - {name: HOST, value: tvbo-postgres}
            - {name: USER, value: tvbo_odoo}
            - {name: PASSWORD, value: odoo} # dont worry we can make this a secret later :)
            - {name: TVBO_API_URL, value: http://tvbo-api:8000}
            - {name: TVBO_UPGRADE, value: "1"}
            - {name: PYTHONFAULTHANDLER, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: ODOO_LOG_LEVEL, value: "info"}
            # Holds a failed-upgrade pod for `kubectl exec` debugging instead of
            # crash-looping. Now backstopped by the readiness probe below: on a
            # failed upgrade the server never starts, the probe never passes, the
            # pod stays NotReady and the rollout visibly fails (no silent zombie).
            - {name: TVBO_KEEP_ALIVE_ON_FAIL, value: "1"}
          volumeMounts: [{name: data, mountPath: /var/lib/odoo}]
          # Gate readiness on the Odoo HTTP server actually being up. The upgrade
          # phase runs before the server starts, so the pod only goes Ready once
          # init + `-u tvbo` complete — a hung/failed upgrade can no longer be
          # reported as a successful rollout.
          readinessProbe:
            httpGet: {path: /web/health, port: 8069}
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tvbo-odoo-pvc

---
# Services
apiVersion: v1
kind: Service
metadata:
  name: tvbo-api
  namespace: kube-system
spec:
  selector:
    app: tvbo-api
  ports: [{port: 8000}]

---
apiVersion: v1
kind: Service
metadata:
  name: tvbo-odoo
  namespace: kube-system
spec:
  selector:
    app: tvbo-odoo
  ports: [{port: 8069}]

---
# Ingress — Kong API Gateway routes
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tvbo
  namespace: kube-system
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - host: tvbo.charite.de
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tvbo-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tvbo-odoo
                port:
                  number: 8069
